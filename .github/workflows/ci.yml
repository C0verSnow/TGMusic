name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb ffmpeg
      - name: Install and inspect pinned runtime tools
        run: |
          bash scripts/install-tools.sh
          infisical --version
          infisical run --help > /dev/null
          mihomo -v
      - name: Python tests with real headed Chromium
        env:
          TGMUSIC_BROWSER_TEST: 'true'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - run: node --test worker/tests/*.test.js
      - name: Check Worker bundle remotely
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config worker/wrangler.toml

  docker_browser:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect prebuilt Docker login services
        env:
          TGMUSIC_STATE_DIR: ${{ runner.temp }}/tgmusic-docker-login
          TGMUSIC_INI_PATH: ${{ github.workspace }}/config/browser.ini
        run: |
          mkdir -p "$TGMUSIC_STATE_DIR/browser-config"
          export TGMUSIC_UID="$(id -u)" TGMUSIC_GID="$(id -g)"
          docker compose -f docker-compose.login.yml config --quiet
          docker compose -f docker-compose.login.yml up -d browser
          docker compose -f docker-compose.login.yml run --rm --no-deps observer probe
      - name: Stop Docker login services
        if: always()
        env:
          TGMUSIC_STATE_DIR: ${{ runner.temp }}/tgmusic-docker-login
          TGMUSIC_INI_PATH: ${{ github.workspace }}/config/browser.ini
        run: docker compose -f docker-compose.login.yml down --remove-orphans

  secrets:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned and verified tools
        run: bash scripts/install-tools.sh
      - name: Verify configuration without starting application services
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
          INFISICAL_SECRET_PATH: ${{ secrets.INFISICAL_SECRET_PATH }}
          INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
        run: >-
          python src/infisical_boot.py -c
          'import os; required = ["R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "PROFILE_ENCRYPTION_KEY", "TELEGRAM_BOT_TOKEN"];
          assert all(os.environ.get(key) for key in required); print("Runner configuration is available")'

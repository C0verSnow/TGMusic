name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test worker/tests/*.test.js
      - name: Check Worker bundle remotely
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config worker/wrangler.toml

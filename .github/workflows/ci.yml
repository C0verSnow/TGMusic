name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb ffmpeg
      - name: Install and inspect pinned runtime tools
        run: |
          bash scripts/install-tools.sh
          infisical --version
          infisical run --help > /dev/null
          mihomo -v
      - name: Python tests with real headed Chromium
        env:
          TGMUSIC_BROWSER_TEST: 'true'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - run: node --test worker/tests/*.test.js
      - name: Check Worker bundle remotely
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config worker/wrangler.toml

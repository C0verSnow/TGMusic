name: YouTube Music Sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-music-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.TGMUSIC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and system dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg libnss3-tools
      - name: Install pinned and verified tools
        run: bash scripts/install-tools.sh
      - name: Fetch secrets and run sync
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
          INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH }}
          INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
        run: xvfb-run -a python src/infisical_boot.py src/main.py

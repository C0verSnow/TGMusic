name: YouTube Music Sync
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'sync sends playlist audio and continues in batches; bootstrap initializes once; check-audio inspects a playlist sample'
        type: choice
        options:
          - sync
          - bootstrap
          - check-audio
        default: sync
      video_id:
        description: 'check-audio only: video ID from the configured playlist; does not send messages'
        required: false
        default: ''
      target_chat_ids:
        description: 'Optional JSON array of authorized target chat IDs; empty means all'
        required: false
        default: ''
      reply_chat_id:
        description: 'Chat to receive the final sync result; empty means Owner'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: youtube-music-sync
  cancel-in-progress: false
  queue: max
jobs:
  sync:
    permissions:
      contents: write
      actions: write
    if: github.event_name == 'workflow_dispatch' || vars.TGMUSIC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python and system dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg libnss3-tools
      - name: Install pinned and verified tools
        run: bash scripts/install-tools.sh
      - name: Fetch secrets and run selected operation
        env:
          TGMUSIC_OPERATION: ${{ inputs.operation || 'sync' }}
          TGMUSIC_VIDEO_ID: ${{ inputs.video_id }}
          SYNC_TARGET_CHAT_IDS: ${{ inputs.target_chat_ids }}
          SYNC_REPLY_CHAT_ID: ${{ inputs.reply_chat_id }}
          GITHUB_TOKEN: ${{ github.token }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: ${{ vars.INFISICAL_ENVIRONMENT }}
          INFISICAL_SECRET_PATH: ${{ secrets.INFISICAL_SECRET_PATH }}
          INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
        run: |
          if [ "$TGMUSIC_OPERATION" = bootstrap ]; then
            python src/infisical_boot.py src/manage.py bootstrap
          elif [ "$TGMUSIC_OPERATION" = check-audio ]; then
            xvfb-run -a python src/infisical_boot.py scripts/check-audio.py "$TGMUSIC_VIDEO_ID"
          else
            xvfb-run -a python src/infisical_boot.py src/main.py
          fi

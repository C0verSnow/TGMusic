x-python: &python
  image: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
  user: "${TGMUSIC_UID:-1000}:${TGMUSIC_GID:-1000}"
  working_dir: /app
  entrypoint: ["/bin/sh", "/app/scripts/docker-entrypoint.sh"]
  volumes:
    - .:/app:ro
    - ${TGMUSIC_STATE_DIR:?Use scripts/docker-login.sh}:/state
    - ${TGMUSIC_INI_PATH:?Use scripts/docker-login.sh}:/input/browser.ini:ro
  profiles: [tools]

services:
  browser:
    image: ghcr.io/linuxserver/chromium@sha256:ff1b8235e20367c3b660d31892e14428687df75e2d62e274b7d8d40cf5537108
    shm_size: 1gb
    ports:
      - "127.0.0.1:${TGMUSIC_LOGIN_PORT:-3000}:3000"
    environment:
      PUID: "${TGMUSIC_UID:-1000}"
      PGID: "${TGMUSIC_GID:-1000}"
      TZ: UTC
      CHROME_CLI: "--no-sandbox --password-store=basic --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 https://music.youtube.com/"
    volumes:
      - ${TGMUSIC_STATE_DIR:?Use scripts/docker-login.sh}/browser-config:/config
    stop_grace_period: 40s

  observer:
    <<: *python
    network_mode: service:browser
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /state/python-deps:/app/src
      TGMUSIC_LOGIN_TIMEOUT: "${TGMUSIC_LOGIN_TIMEOUT:-1800}"
    command: [observe]

  uploader:
    <<: *python
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /state/python-deps:/app/src
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_PROFILE_OBJECT: "${R2_PROFILE_OBJECT:-auth/google-profile.tar.enc}"
      PROFILE_ENCRYPTION_KEY: "${PROFILE_ENCRYPTION_KEY:-}"
    command: [prepare]
